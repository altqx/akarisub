name: Build and Release

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_changed: ${{ steps.compare_versions.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid package version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version has changed
        id: compare_versions
        env:
          CURRENT_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          if [ "$LATEST_TAG" = "none" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "First release: $CURRENT_VERSION"
          else
            LATEST_VERSION=${LATEST_TAG#v}
            if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Version unchanged: $CURRENT_VERSION"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Version bumped from $LATEST_VERSION to $CURRENT_VERSION"
            fi
          fi

  build:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            bison \
            cmake \
            flex \
            gettext \
            gperf \
            libtool \
            make \
            pkg-config \
            python3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.6
          actions-cache-folder: emsdk-cache

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript
        run: bun run typecheck

      - name: Test TypeScript
        run: bun test ./tests

      - name: Build WASM and TypeScript
        run: bun run build

      - name: Verify hashed pthread bootstrap support
        run: |
          grep -Fq 'mainScriptUrlOrBlob' pkg/akarisub-mt.js
          grep -Fq 'mainScriptUrlOrBlob' dist/ts/worker.js

      - name: Record artifact digests
        run: find dist pkg -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/akarisub-dist.sha256 && mv /tmp/akarisub-dist.sha256 dist/SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: akarisub-dist
          path: |
            dist/
            pkg/

  publish:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: akarisub-dist

      - name: Verify build artifact digests
        run: sha256sum --check --strict dist/SHA256SUMS

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Sync JSR manifest version
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs'

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const jsr = JSON.parse(readFileSync('jsr.json', 'utf8'))

          jsr.version = pkg.version

          writeFileSync('jsr.json', `${JSON.stringify(jsr, null, 2)}\n`)
          EOF

      - name: Publish to JSR
        run: |
          jsr_name=$(node -p "require('./jsr.json').name")
          jsr_version=$(node -p "require('./jsr.json').version")
          jsr_path=${jsr_name#@}

          if curl -fsS -o /dev/null "https://jsr.io/@${jsr_path}/${jsr_version}_meta.json" 2>/dev/null; then
            echo "${jsr_name} v${jsr_version} is already available on JSR; skipping publish"
          else
            deno publish --no-check --sloppy-imports --allow-dirty
          fi

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: |
            ## akarisub v${{ needs.check-version.outputs.version }}

            ### Installation

            **npm / bun**
            ```bash
            npm install akarisub
            # or
            bun add akarisub
            ```

            **JSR (Deno)**
            ```bash
            deno add jsr:@altq/akarisub
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
