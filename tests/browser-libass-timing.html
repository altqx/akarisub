<!doctype html>
<meta charset="utf-8" />
<title>AkariSub libass timing boundary test</title>
<canvas id="subtitles" width="320" height="180"></canvas>
<pre id="result">RUNNING</pre>
<script type="module">
  import AkariSub from '/dist/index.js'

  const subtitle = `[Script Info]
ScriptType: v4.00+
PlayResX: 320
PlayResY: 180

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Default,Liberation Sans,32,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,2,0,2,10,10,20,1

[Events]
Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
Dialogue: 0,0:00:00.00,0:00:00.50,Default,,0,0,0,,ZERO
Dialogue: 0,0:00:01.00,0:00:02.00,Default,,0,0,0,,TIMING
Dialogue: 0,0:00:03.00,0:00:04.00,Default,,0,0,0,,{\\an7\\bord0\\shad0\\move(20,30,220,30,0,100)}MOVE
Dialogue: 0,0:00:04.00,0:00:05.00,Default,,0,0,0,,{\\an7\\bord0\\shad0\\pos(20,80)\\fscx100\\t(0,100,\\fscx300)}MMMM
Dialogue: 0,600:00:00.00,600:00:01.00,Default,,0,0,0,,LONG TIMELINE
`

  const canvas = document.querySelector('#subtitles')
  const result = document.querySelector('#result')
  const renderer = new AkariSub({
    canvas,
    subContent: subtitle,
    onDemandRender: false,
    adaptiveTiming: false,
    asyncRender: false,
    offscreenRender: false
  })

  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
  const hasPixels = () => canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data.some(Boolean)

  const pixelBounds = () => {
    const { data, width, height } = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height)
    let left = width
    let right = -1
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (data[(y * width + x) * 4 + 3] === 0) continue
        left = Math.min(left, x)
        right = Math.max(right, x)
      }
    }
    return right < left ? null : { left, width: right - left + 1 }
  }

  const sample = async (time) => {
    renderer.setCurrentTime(true, time, 1)
    await wait(100)
    return hasPixels()
  }

  try {
    await new Promise((resolve, reject) => {
      renderer.addEventListener('ready', resolve, { once: true })
      renderer.addEventListener('error', (event) => reject(event.error || new Error('renderer error')), { once: true })
    })

    // 8.008 * 1000 is 8007.999999999999 in JavaScript. This event verifies
    // that an exact millisecond survives the seconds-to-libass conversion.
    renderer.createEvent({ Start: 8008, Duration: 10, Style: 'Default', Text: 'MILLISECOND' })
    await renderer.getEvents()

    const observations = [
      ['negative-fraction', await sample(-0.0001), false],
      ['zero-start', await sample(0), true],
      ['zero-before-end', await sample(0.4999), true],
      ['zero-at-end', await sample(0.5), false],
      ['before-start', await sample(0.9999), false],
      ['at-start', await sample(1), true],
      ['before-end', await sample(1.9999), true],
      ['at-end', await sample(2), false],
      ['millisecond-boundary-start', await sample(8.008), true],
      ['millisecond-boundary-end', await sample(8.018), false],
      ['long-before-start', await sample(2159999.9999), false],
      ['long-at-start', await sample(2160000), true],
      ['long-at-end', await sample(2160001), false]
    ]
    const failures = observations.filter(([, actual, expected]) => actual !== expected)

    await sample(3)
    const moveStart = pixelBounds()
    await sample(3.05)
    const moveMiddle = pixelBounds()
    await sample(3.1)
    const moveEnd = pixelBounds()

    await sample(4)
    const transformStart = pixelBounds()
    await sample(4.05)
    const transformMiddle = pixelBounds()
    await sample(4.1)
    const transformEnd = pixelBounds()

    const animationChecks = {
      move:
        moveStart &&
        moveMiddle &&
        moveEnd &&
        moveMiddle.left - moveStart.left > 60 &&
        moveEnd.left - moveMiddle.left > 60,
      transform:
        transformStart &&
        transformMiddle &&
        transformEnd &&
        transformMiddle.width > transformStart.width * 1.5 &&
        transformEnd.width > transformMiddle.width * 1.2
    }

    result.textContent =
      failures.length || !animationChecks.move || !animationChecks.transform
        ? `FAIL ${JSON.stringify({ observations, animationChecks, moveStart, moveMiddle, moveEnd, transformStart, transformMiddle, transformEnd })}`
        : 'PASS'
  } catch (error) {
    result.textContent = `ERROR ${error?.stack || error}`
  } finally {
    renderer.destroy()
  }
</script>
