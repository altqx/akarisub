<!doctype html>
<meta charset="utf-8" />
<title>AkariSub libass atlas compositing test</title>
<canvas id="subtitles" width="640" height="360"></canvas>
<canvas id="subtitles-webgpu" width="640" height="360"></canvas>
<pre id="result">RUNNING</pre>
<script type="module">
  import AkariSub from '/dist/index.js'

  // Every case is drawn by the worker's raw ASS_Image WebGL2 compositor twice,
  // once through the libass frame atlas (one upload, one instanced draw) and
  // once through the per-image upload path, and the read-back canvas pixels
  // must be byte-identical. A second instance then draws every case with the
  // worker WebGPU compositor (rawAssImageWebGPU), through the atlas and its
  // per-image fallback, and must match the WebGL2 per-image pixels byte for
  // byte. ?webgpu=optional reports WebGPU as unavailable instead of failing
  // when the browser has no worker WebGPU; ?webgpu=off skips it.
  const params = new URLSearchParams(location.search)
  const webgpuMode = params.get('webgpu') || 'require'
  const drawing = 'm 0 0 l 420 0 420 300 0 300'
  const manyLines = []
  for (let i = 0; i < 48; i++) {
    const x = 20 + (i % 8) * 76
    const y = 30 + Math.floor(i / 8) * 54
    const alpha = ((i * 37) % 200).toString(16).padStart(2, '0').toUpperCase()
    const color = ((i * 0x2f4b17) & 0xffffff).toString(16).padStart(6, '0').toUpperCase()
    manyLines.push(
      `Dialogue: ${i % 3},0:00:08.00,0:00:10.00,Default,,0,0,0,,{\\an7\\pos(${x},${y})\\fs22\\1c&H${color}&\\1a&H${alpha}&\\bord${i % 4}\\shad${i % 2}}L${i}`
    )
  }

  const subtitle = String.raw`[Script Info]
ScriptType: v4.00+
PlayResX: 640
PlayResY: 360
ScaledBorderAndShadow: yes

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Default,Liberation Sans,48,&H00FFFFFF,&H000000FF,&H00101010,&H80000000,0,0,0,0,100,100,0,0,1,3,2,5,10,10,10,1

[Events]
Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
Dialogue: 0,0:00:00.00,0:00:02.00,Default,,0,0,0,,{\pos(320,180)}STATIC LINE
Dialogue: 0,0:00:02.00,0:00:04.00,Default,,0,0,0,,{\an7\move(20,40,420,200,0,2000)\blur2}MOVE
Dialogue: 0,0:00:04.00,0:00:06.00,Default,,0,0,0,,{\pos(320,180)\t(0,2000,\fscx200\frz30\1c&H00FF00&\3c&HFF0000&)\bord3}TRANSFORM
Dialogue: 0,0:00:06.00,0:00:08.00,Default,,0,0,0,,{\pos(320,120)\fs96\blur8\bord6}BLUR
Dialogue: 1,0:00:06.00,0:00:08.00,Default,,0,0,0,,{\pos(320,260)\fs64\be4\1a&H60&\3c&H0000FF&}SOFT EDGE
${manyLines.join('\n')}
Dialogue: 0,0:00:10.00,0:00:12.00,Default,,0,0,0,,{\an7\pos(10,10)\1c&H3060C0&\1a&H40&\bord0\shad0\blur3\p1}${drawing}{\p0}
Dialogue: 1,0:00:10.00,0:00:12.00,Default,,0,0,0,,{\pos(320,250)\fs150\blur10\bord10\3c&H00FFFF&}LARGE
`

  const canvas = document.querySelector('#subtitles')
  const result = document.querySelector('#result')
  const renderer = new AkariSub({
    canvas,
    subContent: subtitle,
    offscreenRender: true,
    rawAssImageGpu: true,
    onDemandRender: false,
    adaptiveTiming: false,
    asyncRender: false,
    useLocalFonts: false
  })

  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
  let nextRequestId = 1
  const debugOn = (target, action, data = {}) =>
    new Promise((resolve, reject) => {
      const requestId = nextRequestId++
      const timer = setTimeout(() => reject(new Error(`rawAssDebug ${action} timed out`)), 10000)
      const onMessage = (event) => {
        if (event.data?.target !== 'rawAssDebug' || event.data.requestId !== requestId) return
        target._worker.removeEventListener('message', onMessage)
        clearTimeout(timer)
        if (event.data.error) reject(new Error(event.data.error))
        else resolve(event.data)
      }
      target._worker.addEventListener('message', onMessage)
      target.sendMessage('rawAssDebug', { action, requestId, ...data })
    })
  const debug = (action, data) => debugOn(renderer, action, data)

  const captureOn = async (target, time, atlas, atlasMaxSize = 0, extra = {}) => {
    await debugOn(target, 'configure', { atlas, atlasMaxSize, ...extra })
    const frame = await debugOn(target, 'capture', { time })
    frame.pixels = frame.pixels ? new Uint8Array(frame.pixels) : null
    return frame
  }
  const capture = (time, atlas, atlasMaxSize = 0) => captureOn(renderer, time, atlas, atlasMaxSize)
  const waitReady = (target) =>
    new Promise((resolve, reject) => {
      target.addEventListener('ready', resolve, { once: true })
      target.addEventListener('error', (event) => reject(event.error || new Error('renderer error')), { once: true })
    })

  const compare = (a, b) => {
    if (!a || !b || a.length !== b.length) return { differingBytes: -1 }
    let differingBytes = 0
    let maxDifference = 0
    for (let i = 0; i < a.length; i++) {
      const difference = Math.abs(a[i] - b[i])
      if (difference) differingBytes++
      if (difference > maxDifference) maxDifference = difference
    }
    return { differingBytes, maxDifference }
  }
  const coveredPixels = (pixels) => {
    let covered = 0
    for (let i = 3; i < pixels.length; i += 4) if (pixels[i]) covered++
    return covered
  }
  const summary = (frame) => ({
    path: frame.path,
    status: frame.atlas?.status ?? null,
    instances: frame.atlas?.frame.instanceCount ?? null,
    pages: frame.atlas?.frame.pages ?? null,
    page: frame.atlas ? `${frame.atlas.frame.pageWidth}x${frame.atlas.frame.pageHeight}` : null,
    pixelsChanged: frame.atlas?.frame.pixelsChanged ?? null,
    instancesChanged: frame.atlas?.frame.instancesChanged ?? null,
    uploads: { pixels: frame.stats.pixelUploads, instances: frame.stats.instanceUploads }
  })

  // Covered pixels of a transferred canvas' placeholder, as the page sees it.
  const presentedPixels = async (target) => {
    let presented = 0
    for (let i = 0; i < 20 && presented <= 500; i++) {
      await new Promise((resolve) => requestAnimationFrame(resolve))
      const probe = document.createElement('canvas')
      probe.width = target.width
      probe.height = target.height
      const ctx = probe.getContext('2d')
      ctx.drawImage(target, 0, 0)
      presented = coveredPixels(ctx.getImageData(0, 0, probe.width, probe.height).data)
    }
    return presented
  }

  // A pack that is not drawn must still reach the GPU with the next draw.
  // Both cases first draw the 48-line atlas, so a skipped upload would show
  // those lines instead of the static one.
  const checkUndrawnPacks = async (target, prefix, staticReference) => {
    const run = (action, data = {}) => debugOn(target, action, data)
    // (a) libass last rendered the static line through the per-image path, so
    //     a non-forced render of the same line reports no change and is not
    //     drawn, while its atlas pack is new.
    await captureOn(target, 9.0, true)
    await captureOn(target, 0.5, false)
    await run('configure', { atlas: true })
    const unchangedBefore = await run('stats')
    const unchanged = await run('render', { time: 1.5 })
    const unchangedAfter = await captureOn(target, 1.5, true)
    const unchangedDiff = compare(unchangedAfter.pixels, staticReference)
    report[`${prefix}undrawn-unchanged`] = {
      undrawn: { path: unchanged.path, atlas: unchanged.atlas?.frame ?? null },
      after: summary(unchangedAfter),
      uploadsBefore: unchangedBefore.stats,
      ...unchangedDiff
    }
    check(
      `${prefix}undrawn-unchanged-not-drawn`,
      unchanged.path === null && unchanged.atlas?.status === 1 && unchanged.atlas.frame.pixelsChanged === true,
      report[`${prefix}undrawn-unchanged`]
    )
    check(
      `${prefix}undrawn-unchanged-uploaded-later`,
      unchangedAfter.path === 'atlas' &&
        unchangedAfter.atlas?.frame.pixelsChanged === false &&
        unchangedAfter.stats.pixelUploads === unchangedBefore.stats.pixelUploads + 1,
      report[`${prefix}undrawn-unchanged`]
    )
    check(`${prefix}undrawn-unchanged-identical`, unchangedDiff.differingBytes === 0, unchangedDiff)

    // (b) A frame whose presentation is already stale is packed but not drawn.
    await captureOn(target, 9.0, true)
    const staleBefore = await run('stats')
    const stale = await run('render', { time: 0.5, stalePresentation: true })
    const staleAfter = await captureOn(target, 1.5, true)
    const staleDiff = compare(staleAfter.pixels, staticReference)
    report[`${prefix}undrawn-stale`] = {
      undrawn: { path: stale.path, atlas: stale.atlas?.frame ?? null },
      after: summary(staleAfter),
      uploadsBefore: staleBefore.stats,
      ...staleDiff
    }
    check(
      `${prefix}undrawn-stale-not-drawn`,
      stale.path === null &&
        stale.atlas?.status === 1 &&
        stale.atlas.frame.pixelsChanged === true &&
        stale.atlas.frame.instancesChanged === true,
      report[`${prefix}undrawn-stale`]
    )
    check(
      `${prefix}undrawn-stale-uploaded-later`,
      staleAfter.path === 'atlas' &&
        staleAfter.atlas?.frame.pixelsChanged === false &&
        staleAfter.atlas?.frame.instancesChanged === false &&
        staleAfter.stats.pixelUploads === staleBefore.stats.pixelUploads + 1 &&
        staleAfter.stats.instanceUploads === staleBefore.stats.instanceUploads + 1,
      report[`${prefix}undrawn-stale`]
    )
    check(`${prefix}undrawn-stale-identical`, staleDiff.differingBytes === 0, staleDiff)
  }

  const failures = []
  let gpuRenderer = null
  const report = {}
  const check = (name, condition, detail) => {
    if (!condition) failures.push({ name, detail })
  }

  try {
    await waitReady(renderer)
    renderer.setCurrentTime(true, 0.5, 1)
    await wait(200)
    const initial = await debug('stats')
    check('atlas-available', initial.atlasAvailable && initial.atlasEnabled, initial)
    const stats = await renderer.getStats()
    report.build = { wasmThreads: stats.wasmThreads, wasmSimd: stats.wasmSimd, workerRenderer: stats.workerRenderer }

    // 1. Atlas and per-image paths are pixel-identical. maxSize forces small
    //    pages, so large images are tiled and spread over several pages.
    const cases = [
      { name: 'static', time: 0.5 },
      { name: 'move-a', time: 2.5 },
      { name: 'move-b', time: 3.0 },
      { name: 'move-subpixel', time: 3.317 },
      { name: 'transform', time: 4.9 },
      { name: 'blur', time: 7.0 },
      { name: 'many-lines', time: 9.0 },
      { name: 'large', time: 11.0 },
      { name: 'large-tiled-pages', time: 11.0, atlasMaxSize: 256, minPages: 2 },
      { name: 'many-lines-small-pages', time: 9.0, atlasMaxSize: 96, minPages: 2 }
    ]
    const references = {}
    for (const { name, time, atlasMaxSize = 0, minPages = 1 } of cases) {
      const atlasFrame = await capture(time, true, atlasMaxSize)
      const imageFrame = await capture(time, false)
      references[time] = imageFrame.pixels
      const diff = compare(atlasFrame.pixels, imageFrame.pixels)
      const covered = imageFrame.pixels ? coveredPixels(imageFrame.pixels) : 0
      report[name] = { ...summary(atlasFrame), covered, ...diff }
      check(`${name}-atlas-path`, atlasFrame.path === 'atlas' && atlasFrame.atlas?.status === 1, report[name])
      check(`${name}-image-path`, imageFrame.path === 'images', imageFrame.path)
      check(`${name}-identical`, diff.differingBytes === 0, diff)
      check(`${name}-not-blank`, covered > 500, covered)
      check(`${name}-pages`, (atlasFrame.atlas?.frame.pages ?? 0) >= minPages, report[name])
    }

    // 2. A frame that does not fit max_pages falls back to per-image uploads.
    const overflow = await capture(11.0, true, 16)
    report['page-overflow-fallback'] = { ...summary(overflow), ...compare(overflow.pixels, references[11.0]) }
    check('overflow-status', overflow.atlas?.status === -1, report['page-overflow-fallback'])
    check('overflow-path', overflow.path === 'images', overflow.path)
    check('overflow-identical', compare(overflow.pixels, references[11.0]).differingBytes === 0, null)

    // 3. Unchanged frames reuse the uploaded atlas: no page or instance upload.
    const static1 = await capture(0.5, true)
    const static2 = await capture(1.5, true)
    report['static-reuse'] = { first: summary(static1), second: summary(static2) }
    check('static-reuse-flags', static2.atlas?.frame.pixelsChanged === false && static2.atlas?.frame.instancesChanged === false, report['static-reuse'])
    check(
      'static-reuse-no-upload',
      static2.stats.pixelUploads === static1.stats.pixelUploads && static2.stats.instanceUploads === static1.stats.instanceUploads,
      report['static-reuse']
    )
    check('static-reuse-identical', compare(static2.pixels, references[0.5]).differingBytes === 0, null)

    // Integer \move steps keep the bitmaps: libass reports only instances changed.
    const move1 = await capture(2.5, true)
    const move2 = await capture(3.0, true)
    report['move-reuse'] = { first: summary(move1), second: summary(move2) }
    check('move-reuse-identical', compare(move2.pixels, references[3.0]).differingBytes === 0, null)
    check(
      'move-reuse-instances-only',
      move2.atlas?.frame.pixelsChanged === false &&
        move2.atlas?.frame.instancesChanged === true &&
        move2.stats.pixelUploads === move1.stats.pixelUploads &&
        move2.stats.instanceUploads === move1.stats.instanceUploads + 1,
      report['move-reuse']
    )

    await checkUndrawnPacks(renderer, '', references[0.5])

    // 4. Context loss: libass' atlas is reset and fully re-uploaded by the
    //    forced re-render after restore. Park the clock on the captured frame,
    //    so without the reset libass would report that frame as unchanged.
    renderer.setCurrentTime(true, 11.0, 1)
    await wait(200)
    const beforeLoss = await capture(11.0, true)
    const lost = await debug('loseContext')
    check('lose-context-extension', lost.ok, lost)
    let state = lost
    for (let i = 0; i < 50 && !state.contextLost; i++) {
      await wait(50)
      state = await debug('stats')
    }
    check('context-lost', state.contextLost, state)
    await debug('restoreContext')
    for (let i = 0; i < 100 && (state.contextLost || state.stats.contextRestores < 1); i++) {
      await wait(50)
      state = await debug('stats')
    }
    check('context-restored', !state.contextLost && state.stats.contextRestores === 1, state)
    const afterRestore = await capture(11.0, true)
    report['context-loss'] = {
      before: summary(beforeLoss),
      restoreRender: state.lastAtlas,
      after: summary(afterRestore),
      stats: afterRestore.stats,
      ...compare(afterRestore.pixels, references[11.0])
    }
    check('context-before-unchanged', beforeLoss.atlas?.frame.pixelsChanged === false, report['context-loss'])
    check(
      'context-restore-reset',
      state.lastAtlas?.status === 1 && state.lastAtlas.frame.pixelsChanged && state.lastAtlas.frame.instancesChanged,
      report['context-loss']
    )
    check('context-restore-path', afterRestore.path === 'atlas', report['context-loss'])
    check('context-restore-reuploaded', afterRestore.stats.pixelUploads > beforeLoss.stats.pixelUploads, report['context-loss'])
    check('context-restore-identical', compare(afterRestore.pixels, references[11.0]).differingBytes === 0, report['context-loss'])

    // Same placeholder probe for the WebGL2 canvas, for comparison.
    await capture(9.0, true)
    report['webgl2-presented'] = await presentedPixels(canvas)

    // 5. Worker WebGPU: the same cases through a second instance, compared
    //    with the WebGL2 per-image pixels above.
    if (webgpuMode !== 'off') {
      renderer.destroy()
      const gpuCanvas = document.querySelector('#subtitles-webgpu')
      gpuRenderer = new AkariSub({
        canvas: gpuCanvas,
        subContent: subtitle,
        offscreenRender: true,
        rawAssImageGpu: true,
        rawAssImageWebGPU: true,
        onDemandRender: false,
        adaptiveTiming: false,
        asyncRender: false,
        useLocalFonts: false
      })
      await waitReady(gpuRenderer)
      gpuRenderer.setCurrentTime(true, 0.5, 1)
      await wait(200)
      const gpuStats = await gpuRenderer.getStats()
      report.webgpu = { workerRenderer: gpuStats.workerRenderer, navigatorGpu: 'gpu' in navigator }
      const gpuDebug = (action, data) => debugOn(gpuRenderer, action, data)
      const gpuCapture = (time, atlas, atlasMaxSize = 0, extra = {}) => captureOn(gpuRenderer, time, atlas, atlasMaxSize, extra)
      let gpuInitial = null
      if (gpuStats.workerRenderer === 'webgpu-raw-ass') {
        // Browsers that cannot present a WebGPU canvas lose the device right
        // after configure; the renderer gives up after a few early losses.
        await wait(500)
        gpuInitial = await gpuDebug('stats')
        report.webgpu.failed = gpuInitial.failed
        report.webgpu.contextLosses = gpuInitial.stats.contextLosses
      }
      if (!gpuInitial || gpuInitial.failed) {
        report.webgpu.available = false
        check('webgpu-active', webgpuMode === 'optional', report.webgpu)
      } else {
        report.webgpu.available = true
        report.webgpu.uploads = gpuInitial.uploads
        check('webgpu-atlas-available', gpuInitial.renderer === 'webgpu' && gpuInitial.atlasAvailable, gpuInitial)

        for (const { name, time, atlasMaxSize = 0, minPages = 1 } of cases) {
          const atlasFrame = await gpuCapture(time, true, atlasMaxSize)
          const imageFrame = await gpuCapture(time, false)
          const atlasDiff = compare(atlasFrame.pixels, references[time])
          const imageDiff = compare(imageFrame.pixels, references[time])
          report[`webgpu-${name}`] = { ...summary(atlasFrame), atlas: atlasDiff, images: imageDiff }
          check(`webgpu-${name}-atlas-path`, atlasFrame.path === 'atlas' && atlasFrame.atlas?.status === 1, report[`webgpu-${name}`])
          check(`webgpu-${name}-image-path`, imageFrame.path === 'images', imageFrame.path)
          check(`webgpu-${name}-atlas-identical`, atlasDiff.differingBytes === 0, atlasDiff)
          check(`webgpu-${name}-images-identical`, imageDiff.differingBytes === 0, imageDiff)
          check(`webgpu-${name}-pages`, (atlasFrame.atlas?.frame.pages ?? 0) >= minPages, report[`webgpu-${name}`])
        }

        const gpuOverflow = await gpuCapture(11.0, true, 16)
        report['webgpu-page-overflow-fallback'] = { ...summary(gpuOverflow), ...compare(gpuOverflow.pixels, references[11.0]) }
        check('webgpu-overflow-status', gpuOverflow.atlas?.status === -1, report['webgpu-page-overflow-fallback'])
        check('webgpu-overflow-path', gpuOverflow.path === 'images', gpuOverflow.path)
        check('webgpu-overflow-identical', compare(gpuOverflow.pixels, references[11.0]).differingBytes === 0, null)

        const gpuStatic1 = await gpuCapture(0.5, true)
        const gpuStatic2 = await gpuCapture(1.5, true)
        report['webgpu-static-reuse'] = { first: summary(gpuStatic1), second: summary(gpuStatic2) }
        check(
          'webgpu-static-reuse-no-upload',
          gpuStatic2.atlas?.frame.pixelsChanged === false &&
            gpuStatic2.atlas?.frame.instancesChanged === false &&
            gpuStatic2.stats.pixelUploads === gpuStatic1.stats.pixelUploads &&
            gpuStatic2.stats.instanceUploads === gpuStatic1.stats.instanceUploads,
          report['webgpu-static-reuse']
        )
        check('webgpu-static-reuse-identical', compare(gpuStatic2.pixels, references[0.5]).differingBytes === 0, null)

        const gpuMove1 = await gpuCapture(2.5, true)
        const gpuMove2 = await gpuCapture(3.0, true)
        report['webgpu-move-reuse'] = { first: summary(gpuMove1), second: summary(gpuMove2) }
        check('webgpu-move-reuse-identical', compare(gpuMove2.pixels, references[3.0]).differingBytes === 0, null)
        check(
          'webgpu-move-reuse-instances-only',
          gpuMove2.atlas?.frame.pixelsChanged === false &&
            gpuMove2.atlas?.frame.instancesChanged === true &&
            gpuMove2.stats.pixelUploads === gpuMove1.stats.pixelUploads &&
            gpuMove2.stats.instanceUploads === gpuMove1.stats.instanceUploads + 1,
          report['webgpu-move-reuse']
        )

        await checkUndrawnPacks(gpuRenderer, 'webgpu-', references[0.5])

        // Shared WASM memory goes through the staging copy when forced; with
        // the pthread build this is the path for browsers that reject it.
        const staged = await gpuCapture(9.0, true, 0, { forceStaging: true })
        await gpuDebug('configure', { forceStaging: false })
        report['webgpu-staging'] = { uploads: staged.uploads, ...compare(staged.pixels, references[9.0]) }
        check('webgpu-staging-identical', compare(staged.pixels, references[9.0]).differingBytes === 0, report['webgpu-staging'])
        check(
          'webgpu-staging-used',
          !staged.uploads.sharedMemory || staged.uploads.staged > 0,
          report['webgpu-staging']
        )

        // The canvas placeholder on the page shows what the worker drew.
        await gpuCapture(9.0, true)
        const presented = await presentedPixels(gpuCanvas)
        report['webgpu-presented'] = presented
        // Some windowed sessions never show the WebGL2 placeholder either
        // (no frames for an unfocused window); only require it where they do.
        check('webgpu-presented', presented > 500 || report['webgl2-presented'] <= 500, { webgpu: presented, webgl2: report['webgl2-presented'] })

        // Device loss: libass' atlas is reset, a new device is acquired and
        // the forced re-render uploads everything again.
        gpuRenderer.setCurrentTime(true, 11.0, 1)
        await wait(200)
        const gpuBefore = await gpuCapture(11.0, true)
        const gpuLost = await gpuDebug('loseContext')
        check('webgpu-lose-device', gpuLost.ok, gpuLost)
        let gpuState = gpuLost
        for (let i = 0; i < 200 && gpuState.stats.contextRestores < 1; i++) {
          await wait(50)
          gpuState = await gpuDebug('stats')
        }
        check('webgpu-device-restored', !gpuState.contextLost && gpuState.stats.contextLosses === 1 && gpuState.stats.contextRestores === 1, gpuState)
        const gpuAfter = await gpuCapture(11.0, true)
        report['webgpu-device-loss'] = {
          before: summary(gpuBefore),
          restoreRender: gpuState.lastAtlas,
          after: summary(gpuAfter),
          stats: gpuAfter.stats,
          ...compare(gpuAfter.pixels, references[11.0])
        }
        check(
          'webgpu-restore-reset',
          gpuState.lastAtlas?.status === 1 && gpuState.lastAtlas.frame.pixelsChanged && gpuState.lastAtlas.frame.instancesChanged,
          report['webgpu-device-loss']
        )
        check('webgpu-restore-path', gpuAfter.path === 'atlas', report['webgpu-device-loss'])
        check('webgpu-restore-reuploaded', gpuAfter.stats.pixelUploads > gpuBefore.stats.pixelUploads, report['webgpu-device-loss'])
        check('webgpu-restore-identical', compare(gpuAfter.pixels, references[11.0]).differingBytes === 0, report['webgpu-device-loss'])

        // Devices lost right after creation make recovery give up. This
        // caller-owned canvas cannot be replaced: the page is told, frames
        // are skipped instead of failing, and getStats reports it.
        const warnings = []
        gpuRenderer.addEventListener('performanceWarning', (event) => warnings.push(event.detail))
        let giveUp = await gpuDebug('stats')
        for (let i = 0; i < 6 && !giveUp.failed; i++) {
          const losses = giveUp.stats.contextLosses
          await gpuDebug('loseContext')
          for (let j = 0; j < 200; j++) {
            giveUp = await gpuDebug('stats')
            if (giveUp.failed || (giveUp.stats.contextLosses > losses && !giveUp.contextLost)) break
            await wait(20)
          }
        }
        await wait(100)
        const deadRender = await gpuDebug('render', { time: 9.0, force: true })
        const deadStats = await gpuRenderer.getStats()
        report['webgpu-give-up'] = {
          failed: giveUp.failed,
          contextLost: giveUp.contextLost,
          losses: giveUp.stats.contextLosses,
          warnings,
          deadRenderPath: deadRender.path,
          workerRenderer: deadStats.workerRenderer,
          workerRendererLost: deadStats.workerRendererLost
        }
        check('webgpu-give-up-failed', giveUp.failed && giveUp.contextLost, report['webgpu-give-up'])
        check(
          'webgpu-give-up-reported',
          warnings.some((w) => w.kind === 'renderer-recovery' && w.reason === 'device-lost'),
          report['webgpu-give-up']
        )
        check('webgpu-give-up-skips-frames', deadRender.path === null && deadRender.atlas === null, report['webgpu-give-up'])
        check('webgpu-give-up-stats', deadStats.workerRendererLost === true, report['webgpu-give-up'])
      }
    }

    result.textContent = failures.length
      ? `FAIL ${JSON.stringify({ failures, report })}`
      : `PASS ${JSON.stringify(report)}`
  } catch (error) {
    result.textContent = `ERROR ${error?.stack || error} ${JSON.stringify({ failures, report })}`
  } finally {
    renderer.destroy()
    gpuRenderer?.destroy()
  }
</script>
