<!doctype html>
<meta charset="utf-8" />
<title>AkariSub libass blur compositing test</title>
<canvas id="subtitles" width="640" height="360"></canvas>
<pre id="result">RUNNING</pre>
<script type="module">
  import AkariSub from '/dist/index.js'

  const subtitle = String.raw`[Script Info]
ScriptType: v4.00+
PlayResX: 640
PlayResY: 360
ScaledBorderAndShadow: yes

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Default,Liberation Sans,96,&H00FFFFFF,&H000000FF,&H0000FFFF,&H00000000,0,0,0,0,100,100,0,0,1,8,0,5,10,10,10,1

[Events]
Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
Dialogue: 0,0:00:00.00,0:00:02.00,Default,,0,0,0,,{\blur20}BLUR`

  const canvas = document.querySelector('#subtitles')
  const result = document.querySelector('#result')
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

  const render = async (blendMode, asyncRender) => {
    canvas.width = 640
    canvas.height = 360

    const renderer = new AkariSub({
      canvas,
      subContent: subtitle,
      workerUrl: '/dist/akarisub-worker.js',
      wasmUrl: '/dist/akarisub-worker.wasm',
      blendMode,
      asyncRender,
      offscreenRender: false,
      onDemandRender: false,
      adaptiveTiming: false,
      useLocalFonts: false,
      useFontconfigProvider: false
    })

    try {
      await new Promise((resolve, reject) => {
        renderer.addEventListener('ready', resolve, { once: true })
        renderer.addEventListener('error', (event) => reject(event.error || new Error('renderer error')), {
          once: true
        })
      })
      renderer.setCurrentTime(true, 1, 1)
      await wait(100)
      return new Uint8Array(canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data)
    } finally {
      renderer.destroy()
    }
  }

  const compare = (actual, expected) => {
    let maxChannelDifference = 0
    let maxAlphaDifference = 0
    let lowAlphaPixels = 0

    for (let i = 0; i < actual.length; i++) {
      const difference = Math.abs(actual[i] - expected[i])
      maxChannelDifference = Math.max(maxChannelDifference, difference)
      if ((i & 3) === 3) {
        maxAlphaDifference = Math.max(maxAlphaDifference, difference)
        if (actual[i] > 0 && actual[i] < 4) lowAlphaPixels++
      }
    }

    return { maxChannelDifference, maxAlphaDifference, lowAlphaPixels }
  }

  try {
    const frames = {
      'wasm-sync': await render('wasm', false),
      'wasm-async': await render('wasm', true),
      'js-sync': await render('js', false),
      'js-async': await render('js', true)
    }
    const reference = frames['js-async']
    const observations = Object.fromEntries(
      Object.entries(frames).map(([name, frame]) => [name, compare(frame, reference)])
    )
    const failed = Object.values(observations).some(
      ({ maxChannelDifference, maxAlphaDifference, lowAlphaPixels }) =>
        maxChannelDifference > 2 || maxAlphaDifference !== 0 || lowAlphaPixels === 0
    )

    result.textContent = failed ? `FAIL ${JSON.stringify(observations)}` : 'PASS'
  } catch (error) {
    result.textContent = `ERROR ${error?.stack || error}`
  }
</script>
