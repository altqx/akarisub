<!doctype html>
<meta charset="utf-8" />
<title>AkariSub libass event edit test</title>
<canvas id="subtitles" width="320" height="180"></canvas>
<pre id="result">RUNNING</pre>
<script type="module">
  import AkariSub from '/dist/index.js'

  // libass skips whole blocks of 64 events whose timing summary cannot match
  // the frame time. Events edited in place after the first render must still
  // show up at their new time, so use enough events to span several blocks.
  const EVENT_COUNT = 200
  const pad = (n, width = 2) => String(n).padStart(width, '0')
  const assTime = (seconds) =>
    `${Math.floor(seconds / 3600)}:${pad(Math.floor(seconds / 60) % 60)}:${pad(seconds % 60)}.00`
  const lines = []
  for (let i = 0; i < EVENT_COUNT; i++) {
    const start = i * 10
    lines.push(`Dialogue: 0,${assTime(start)},${assTime(start + 1)},Default,,0,0,0,,E${i}`)
  }

  const subtitle = `[Script Info]
ScriptType: v4.00+
PlayResX: 320
PlayResY: 180

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Default,Liberation Sans,32,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,2,0,2,10,10,20,1

[Events]
Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
${lines.join('\n')}
`

  const canvas = document.querySelector('#subtitles')
  const result = document.querySelector('#result')
  const renderer = new AkariSub({
    canvas,
    subContent: subtitle,
    onDemandRender: false,
    adaptiveTiming: false,
    asyncRender: false,
    offscreenRender: false
  })

  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
  const hasPixels = () => canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data.some(Boolean)
  const sample = async (time) => {
    renderer.setCurrentTime(true, time, 1)
    await wait(100)
    return hasPixels()
  }

  try {
    await new Promise((resolve, reject) => {
      renderer.addEventListener('ready', resolve, { once: true })
      renderer.addEventListener('error', (event) => reject(event.error || new Error('renderer error')), { once: true })
    })

    const observations = []
    const check = async (name, time, expected) => observations.push([name, await sample(time), expected])

    // Render once so that libass builds its per-track timing summary.
    await check('initial-e10', 100.5, true)
    await check('initial-gap', 5000.5, false)

    // Retime an event of the first block far past every other event.
    renderer.setEvent({ Start: 5000000, Duration: 1000 }, 10)
    await renderer.getEvents()
    await check('moved-e10-new-time', 5000.5, true)
    await check('moved-e10-old-time', 100.5, false)

    // Stretch an event of the second block over a gap.
    renderer.setEvent({ Duration: 4000000 }, 70)
    await renderer.getEvents()
    await check('stretched-e70', 3000.5, true)

    // Remove an event from the middle; the later events move down by one.
    renderer.removeEvent(5)
    await renderer.getEvents()
    await check('removed-e5', 50.5, false)
    await check('after-remove-e6', 60.5, true)
    await check('after-remove-e150', 1500.5, true)
    await check('after-remove-moved-e10', 5000.5, true)

    const failures = observations.filter(([, actual, expected]) => actual !== expected)
    result.textContent = failures.length ? `FAIL ${JSON.stringify({ observations })}` : 'PASS'
  } catch (error) {
    result.textContent = `ERROR ${error?.stack || error}`
  } finally {
    renderer.destroy()
  }
</script>
